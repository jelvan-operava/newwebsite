<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPERAVA | Operava Global Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-purple: #7C3AED;
      --primary-purple-hover: #6D28D9;
      --primary-purple-light: #A78BFA;
      --dark-purple: #1E0B3A;
      --dark-purple-2: #2A1450;
      --text-white: #FFFFFF;
      --text-light: #F3E8FF;
      --text-muted: #C4B5FD;
      --gray-bg: #FAF5FF;
      --border-light: #E9D5FF;
      --font-heading: 'Roboto Condensed', 'Montserrat', sans-serif;
      --font-body: 'Montserrat', 'Roboto', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      color: #1A202C;
      line-height: 1.6;
      overflow-x: hidden;
      background: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ========== HEADER / NAV ========== */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(30, 11, 58, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .site-header.scrolled {
      background: rgba(30, 11, 58, 0.98);
      box-shadow: 0 2px 20px rgba(0,0,0,0.35);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #7C3AED 0%, #A78BFA 100%);
      clip-path: polygon(0 0, 100% 0, 100% 70%, 70% 100%, 0 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon::after {
      content: '';
      width: 18px;
      height: 18px;
      background: white;
      clip-path: polygon(0 0, 100% 0, 100% 60%, 60% 100%, 0 100%);
      opacity: 0.9;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .logo-text .brand {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 22px;
      color: white;
      letter-spacing: 0.5px;
    }

    .logo-text .sub {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .main-nav a {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.3px;
      position: relative;
    }

    .main-nav a:hover {
      color: white;
    }

    .main-nav a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary-purple);
      transition: width 0.25s ease;
    }

    .main-nav a:hover::after {
      width: 100%;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      flex-direction: column;
      gap: 5px;
    }

    .menu-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: white;
      transition: all 0.3s ease;
    }

    .menu-toggle.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }
    .menu-toggle.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* ========== HERO ========== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: 
        linear-gradient(rgba(30, 11, 58, 0.78), rgba(42, 20, 80, 0.82)),
        url('https://www.inspyrsolutions.com/wp-content/uploads/2024/06/Home-Hero-Image-min.jpg') center/cover no-repeat;
      background-color: var(--dark-purple);
      color: white;
      text-align: center;
      padding: 120px 24px 80px;
      overflow: hidden;
    }

    .hero-content {
      max-width: 980px;
      z-index: 2;
      animation: fadeUp 1s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero h1 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .hero h1 span {
      display: block;
    }

    .hero .subtitle {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(16px, 2.2vw, 20px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.92);
      margin-bottom: 48px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
    }

    .btn-primary {
      background: var(--primary-purple);
      color: white;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
    }

    .btn-primary:hover {
      background: var(--primary-purple-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(124, 58, 237, 0.5);
    }

    /* ========== SECTIONS COMMON ========== */
    .section {
      padding: 90px 24px;
    }

    .section-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: clamp(28px, 4vw, 36px);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      color: var(--dark-purple);
    }

    .section-subtitle {
      font-size: 17px;
      color: #4A5568;
      max-width: 640px;
      margin-bottom: 48px;
    }

    /* ========== OUR SOLUTIONS ========== */
    .solutions {
      background: #fff;
    }

    .solutions-layout {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 48px;
      align-items: center;
    }

    .solutions-image-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(124, 58, 237, 0.15);
    }

    .solutions-image-wrap img {
      width: 100%;
      height: 520px;
      object-fit: cover;
      display: block;
    }

    .solutions-image-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(30,11,58,0.35), transparent 50%);
      pointer-events: none;
    }

    .solutions-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .solutions-layout {
        grid-template-columns: 1fr;
      }
      .solutions-image-wrap img {
        height: 320px;
      }
    }

    .solution-card {
      background: white;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 36px 28px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .solution-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--primary-purple);
      transform: scaleY(0);
      transition: transform 0.3s ease;
    }

    .solution-card:hover {
      box-shadow: 0 16px 40px rgba(124, 58, 237, 0.12);
      transform: translateY(-6px);
      border-color: transparent;
    }

    .solution-card:hover::before {
      transform: scaleY(1);
    }

    .solution-card h3 {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      color: var(--dark-purple);
    }

    .solution-card p {
      font-size: 15px;
      color: #4A5568;
      margin-bottom: 24px;
      line-height: 1.65;
    }

    .solution-card .link {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: 14px;
      color: var(--primary-purple);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .solution-card .link:hover {
      gap: 10px;
    }

    .solution-card .link::after {
      content: '→';
      font-size: 16px;
    }

    /* ========== LATEST JOBS ========== */
    .jobs {
      background: var(--gray-bg);
    }

    .jobs-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .jobs-list {
      display: grid;
      gap: 16px;
    }

    .job-item {
      background: white;
      border-radius: 10px;
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border: 1px solid var(--border-light);
      transition: all 0.25s ease;
    }

    .job-item:hover {
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.1);
      border-color: rgba(124, 58, 237, 0.35);
    }

    .job-info h4 {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 17px;
      color: var(--dark-purple);
      margin-bottom: 6px;
    }

    .job-meta {
      font-size: 14px;
      color: #718096;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .job-type {
      background: #F3E8FF;
      color: var(--primary-purple);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ========== PARTNERS ========== */
    .partners {
      background: white;
      text-align: center;
    }

    .partners-logos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 40px 60px;
      margin-top: 40px;
      opacity: 0.85;
    }

    .partner-logo {
      height: 48px;
      width: auto;
      max-width: 150px;
      object-fit: contain;
      filter: grayscale(20%);
      opacity: 0.9;
      transition: all 0.3s ease;
    }

    .partner-logo:hover {
      filter: grayscale(0%);
      opacity: 1;
      transform: scale(1.06);
    }

    .partners .btn {
      margin-top: 48px;
    }

    /* ========== NEWS & RESOURCES ========== */
    .news {
      background: var(--gray-bg);
    }

    .news-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 28px;
    }

    .news-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-light);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .news-card:hover {
      box-shadow: 0 16px 40px rgba(124, 58, 237, 0.12);
      transform: translateY(-4px);
    }

    .news-card.featured {
      grid-row: span 1;
    }

    .news-image {
      height: 220px;
      background: linear-gradient(135deg, #1E0B3A, #3B1A6E);
      position: relative;
      overflow: hidden;
    }

    .news-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .news-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .news-body h3 {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 18px;
      color: var(--dark-purple);
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .news-body p {
      font-size: 14px;
      color: #4A5568;
      margin-bottom: 16px;
      flex: 1;
    }

    .news-body .link {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: 14px;
      color: var(--primary-purple);
    }

    /* ========== TESTIMONIALS ========== */
    .testimonials {
      background: white;
    }

    .testimonial-slider {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
    }

    .testimonial-card {
      background: var(--gray-bg);
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
    }

    .testimonial-card blockquote {
      font-size: 18px;
      line-height: 1.7;
      color: #2D3748;
      margin-bottom: 28px;
      font-style: italic;
    }

    .testimonial-card cite {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 15px;
      color: var(--primary-purple);
      font-style: normal;
    }

    /* ========== CTA ========== */
    .cta {
      background: linear-gradient(135deg, #1E0B3A 0%, #3B1A6E 100%);
      color: white;
      text-align: center;
      padding: 80px 24px;
    }

    .cta h2 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: clamp(28px, 4vw, 36px);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .cta p {
      font-size: 17px;
      opacity: 0.9;
      margin-bottom: 36px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ========== FOOTER ========== */
    .site-footer {
      background: var(--dark-purple);
      color: rgba(255,255,255,0.8);
      padding: 70px 24px 30px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 48px;
      margin-bottom: 50px;
    }

    .footer-brand .logo {
      margin-bottom: 20px;
    }

    .footer-brand p {
      font-size: 14px;
      line-height: 1.7;
      max-width: 280px;
    }

    .footer-col h4 {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: white;
      margin-bottom: 20px;
    }

    .footer-col ul {
      list-style: none;
    }

    .footer-col li {
      margin-bottom: 12px;
    }

    .footer-col a {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }

    .footer-col a:hover {
      color: white;
    }

    .footer-bottom {
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 28px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
    }

    /* ========== ACCESSIBILITY BUTTON ========== */
    .a11y-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      background: var(--primary-purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.45);
      z-index: 999;
      cursor: pointer;
      border: none;
      transition: transform 0.2s ease;
    }

    .a11y-btn:hover {
      transform: scale(1.08);
    }

    .a11y-btn svg {
      width: 26px;
      height: 26px;
      fill: white;
    }

    /* ========== MOBILE ========== */
    @media (max-width: 1024px) {
      .main-nav {
        display: none;
        position: absolute;
      top: 80px;
        left: 0;
        width: 100%;
        background: var(--dark-purple);
        flex-direction: column;
        padding: 24px;
        gap: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      }

      .main-nav.open {
        display: flex;
      }

      .menu-toggle {
        display: flex;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .footer-inner {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .header-inner {
        height: 70px;
      }

      .hero {
        padding: 110px 20px 60px;
        min-height: 90vh;
      }

      .hero-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }

      .job-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-inner {
        grid-template-columns: 1fr;
        gap: 36px;
      }

      .section {
        padding: 60px 20px;
      }
    }

    /* subtle scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header" id="header">
    <div class="header-inner">
      <a href="#" class="logo">
        <div class="logo-icon" aria-hidden="true"></div>
        <div class="logo-text">
          <span class="brand">OPERAVA</span>
        </div>
      </a>

      <nav class="main-nav" id="mainNav">
        <a href="#about">About Us</a>
        <a href="#referral">Referral Program</a>
        <a href="#jobs">U.S. Job Search</a>
        <a href="#jobs">Global Job Search</a>
        <a href="#resume">Submit Resume</a>
        <a href="#talent">Request Talent</a>
        <a href="#contact">Contact Us</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- PLACEHOLDER: rest of body from original will be incomplete if truncated - need full -->
</body>
</html>
